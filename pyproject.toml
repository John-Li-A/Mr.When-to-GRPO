[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "when-to-grpo"
version = "0.2.1"
description = "A paired-intervention toolkit for OPD-to-GRPO switch-point discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "John Li"}]
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["pandas>=2.2", "pyarrow>=15", "transformers>=4.51"]
test = ["pytest>=8"]

[project.scripts]
when2grpo-audit = "when_to_grpo.rollout_audit:main"
when2grpo-doctor = "when_to_grpo.doctor:main"
when2grpo-plan = "when_to_grpo.protocol:main"
when2grpo-launch = "when_to_grpo.verl:main"
when2grpo-surface = "when_to_grpo.surface:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
