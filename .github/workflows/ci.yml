name: cpu-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[data,test]"
      - run: python -m pytest
      - run: |
          when2grpo-audit --rollout-dir data/examples --n 4 --response-cap 32
          when2grpo-surface --plan data/examples/surface_plan.json --signals data/examples/signals.json --root . --output-dir /tmp/when2grpo-surface
